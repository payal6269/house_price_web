<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>House Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            /* Updated background image */
            background-image: url('https://t3.ftcdn.net/jpg/03/22/06/68/360_F_322066808_CANrp7u5Cdiz7700TJReqKD299d2AZtD.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        /* Overlay to make form text more readable */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 450px;
            background: rgba(255, 255, 255, 0.9);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .alert {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .instructions {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>House Price Prediction</h1>
        <p class="instructions">
            Welcome! Enter your house details below to get an instant price estimate.
        </p>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Area (sq ft):</label>
                <input type="number" class="form-control" name="area" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Bedrooms:</label>
                <input type="number" class="form-control" name="bedrooms" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Washroom Type:</label>
                <select class="form-select" name="washroom" required>
                    <option value="One">One Washroom</option>
                    <option value="Attached">Attached (per Bedroom)</option>
                </select>
            </div>

            <!-- Existing features -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="drawing_room" value="1">
                <label class="form-check-label">Drawing Room</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="dining_area" value="1">
                <label class="form-check-label">Dining Area</label>
            </div>

            <!-- New features -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="balcony" value="1">
                <label class="form-check-label">Balcony</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="garden" value="1">
                <label class="form-check-label">Garden</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Location:</label>
                <select class="form-select" name="location" required>
                    <option value="Patiala">Patiala</option>
                    <option value="Chandigarh">Chandigarh</option>
                    <option value="Amritsar">Amritsar</option>
                    <option value="Jaipur">Jaipur</option>
                    <option value="Jaisalmer">Jaisalmer</option>
                    <option value="Delhi">Delhi</option>
                </select>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Predict Price</button>
            </div>
        </form>

        {% if price %}
        <div class="alert alert-success text-center mt-4">
            Predicted Price: ${{ price | round(2) }}
        </div>
        {% else %}
        <div class="text-center mt-4" style="color:#777;">
            Fill the form and click "Predict Price" to see the result.
        </div>
        {% endif %}
    </div>
</body>
</html>
